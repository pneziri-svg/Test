<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Kastrati TV</title>
<style>
:root{--orange:#ff6a00}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#06101c}body{background-image:linear-gradient(90deg,rgba(3,10,20,.72),rgba(3,10,20,.28)),linear-gradient(0deg,rgba(3,10,20,.45),rgba(3,10,20,.04) 55%),url('project_background.jpg');background-size:cover;background-position:center;background-repeat:no-repeat}#app{width:100vw;height:100vh;padding:4.4vh 5vw 4vh;display:flex;flex-direction:column;outline:none}.brand{display:flex;align-items:center;gap:1.2vw}.logoimg{width:5.8vw;height:5.8vw;min-width:66px;min-height:66px;object-fit:contain}.brand-copy .name{font-size:2.9vw;font-weight:800;letter-spacing:.08em}.brand-copy .tag{font-size:1.05vw;letter-spacing:.45em;color:rgba(255,255,255,.75);margin-top:.65vh}.top-right{position:absolute;top:4.6vh;right:5vw;text-align:right}.date{font-size:1.2vw;font-weight:600}.settings-btn{margin-top:1.1vh;padding:.65vh 1vw;border:2px solid rgba(255,255,255,.45);border-radius:8px;background:rgba(0,0,0,.35);color:#fff;font-size:.9vw;font-weight:700;letter-spacing:.08em}.settings-btn:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,106,0,.28);outline:none}.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(-1.5vh)}.project{font-size:2.2vw;font-weight:700;letter-spacing:.28em;text-transform:uppercase;text-shadow:0 2px 12px #000;margin-bottom:1vh;text-align:center;max-width:78vw}.days{font-size:11.5vw;line-height:.88;font-weight:900;text-shadow:0 0 28px rgba(255,106,0,.55),0 6px 24px #000}.days-label{font-size:2.15vw;font-weight:800;letter-spacing:.35em;margin:1.1vh 0 2.2vh}.time-grid{display:flex;gap:4.8vw}.time-cell{text-align:center;min-width:8vw;position:relative}.time-cell:not(:last-child):after{content:'';position:absolute;right:-2.4vw;top:12%;height:62%;width:2px;background:rgba(255,106,0,.7)}.time-value{font-size:3.8vw;font-weight:900}.time-label{font-size:1vw;letter-spacing:.2em;margin-top:.75vh}.end{font-size:1.12vw;margin-top:2.8vh;letter-spacing:.13em}.bottom{display:flex;justify-content:space-between;align-items:flex-end}.slogan{font-size:1vw;letter-spacing:.28em}.kgroup{font-size:2.1vw;font-weight:800;letter-spacing:.14em;text-align:right}.kgroup small{display:block;font-size:.8vw;letter-spacing:.5em}.accent{height:2px;width:11vw;background:var(--orange);margin:.8vh 0 0 auto}#settings{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);align-items:center;justify-content:center}.panel{width:min(680px,78vw);padding:30px 34px;border-radius:18px;background:#0b141e;border:1px solid #4b5868}.panel h2{margin:0 0 25px;font-size:28px}.row{margin:17px 0}.row label{display:block;font-size:16px;margin-bottom:8px}.row input{width:100%;height:52px;border-radius:9px;border:2px solid #35495c;background:#111c27;color:#fff;font-size:18px;padding:0 14px}.buttons{display:flex;gap:14px;justify-content:flex-end;margin-top:22px}.panel button{height:52px;padding:0 25px;border-radius:9px;border:0;background:#293543;color:#fff;font-size:18px;font-weight:700}.panel button.primary{background:var(--orange);color:#111}.note{font-size:13px;color:#9eacbb;line-height:1.45;margin-top:16px}@media(max-width:900px){.brand-copy .name{font-size:28px}.brand-copy .tag{font-size:10px}.project{font-size:22px}.days{font-size:110px}.time-value{font-size:38px}.settings-btn{font-size:12px}}
</style>
</head>
<body>
<div id="app" tabindex="0">
  <div class="brand"><img class="logoimg" src="kastrati_logo.png" alt="Kastrati"><div class="brand-copy"><div class="name">KASTRATI TV</div><div class="tag">ALWAYS ON TRACK</div></div></div>
  <div class="top-right"><div class="date" id="clock"></div><button id="menuBtn" class="settings-btn" tabindex="0">OK / SETTINGS</button></div>
  <main class="center"><div class="project" id="project">PROJECT COMPLETION</div><div class="days" id="days">000</div><div class="days-label">DAYS</div><div class="time-grid"><div class="time-cell"><div class="time-value" id="hours">00</div><div class="time-label">HOURS</div></div><div class="time-cell"><div class="time-value" id="minutes">00</div><div class="time-label">MINUTES</div></div><div class="time-cell"><div class="time-value" id="seconds">00</div><div class="time-label">SECONDS</div></div></div><div class="end" id="endDate"></div></main>
  <footer class="bottom"><div class="slogan">BUILDING A BETTER TOMORROW</div><div><div class="kgroup">KASTRATI<small>GROUP</small></div><div class="accent"></div></div></footer>
</div>
<div id="settings"><div class="panel"><h2>Kastrati TV — Countdown Settings</h2><div class="row"><label>Project title</label><input id="titleInput" type="text" maxlength="60"></div><div class="row"><label>Project end date and time</label><input id="dateInput" type="datetime-local"></div><div class="buttons"><button id="cancelBtn">Cancel</button><button class="primary" id="saveBtn">Save</button></div><div class="note">Settings are stored locally on the TV.</div></div></div>
<script>
(function(){var KT='kastrati_project_title',KD='kastrati_target_ms',app=document.getElementById('app'),menuBtn=document.getElementById('menuBtn'),p=document.getElementById('project'),d=document.getElementById('days'),h=document.getElementById('hours'),m=document.getElementById('minutes'),s=document.getElementById('seconds'),e=document.getElementById('endDate'),c=document.getElementById('clock'),set=document.getElementById('settings'),ti=document.getElementById('titleInput'),di=document.getElementById('dateInput');function z(n){return String(n).padStart(2,'0')}function title(){return localStorage.getItem(KT)||'PROJECT COMPLETION'}function target(){var x=parseInt(localStorage.getItem(KD)||'0',10);if(!x){x=Date.now()+100*86400000;localStorage.setItem(KD,String(x))}return x}function local(ms){var q=new Date(ms),o=q.getTimezoneOffset()*60000;return new Date(ms-o).toISOString().slice(0,16)}function render(){var t=target(),x=Math.max(0,t-Date.now()),q=Math.floor(x/1000),dd=Math.floor(q/86400),hh=Math.floor(q%86400/3600),mm=Math.floor(q%3600/60),ss=q%60,td=new Date(t),n=new Date();p.textContent=title();d.textContent=dd;h.textContent=z(hh);m.textContent=z(mm);s.textContent=z(ss);e.textContent='PROJECT END: '+z(td.getDate())+'.'+z(td.getMonth()+1)+'.'+td.getFullYear()+'  '+z(td.getHours())+':'+z(td.getMinutes());c.textContent=z(n.getDate())+'.'+z(n.getMonth()+1)+'.'+n.getFullYear()+'  '+z(n.getHours())+':'+z(n.getMinutes())}function open(){ti.value=title();di.value=local(target());set.style.display='flex';setTimeout(function(){ti.focus()},50)}function close(){set.style.display='none';setTimeout(function(){menuBtn.focus()},50)}menuBtn.onclick=open;document.getElementById('saveBtn').onclick=function(){var ms=new Date(di.value).getTime();if(!isNaN(ms)){localStorage.setItem(KT,ti.value.trim()||'PROJECT COMPLETION');localStorage.setItem(KD,String(ms));close();render()}};document.getElementById('cancelBtn').onclick=close;function handle(ev){var k=ev.keyCode||ev.which;if(set.style.display==='flex'){if(k===27||k===8||k===461||k===10009){ev.preventDefault();close()}return}if(k===13||k===23||k===66||k===65376){ev.preventDefault();open()}}document.addEventListener('keydown',handle,true);document.addEventListener('keyup',function(ev){var k=ev.keyCode||ev.which;if(set.style.display!=='flex'&&(k===13||k===23||k===66||k===65376)){ev.preventDefault();open()}},true);render();setInterval(render,1000);setTimeout(function(){menuBtn.focus()},300)})();
</script>
</body></html>
