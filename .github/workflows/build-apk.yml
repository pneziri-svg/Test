name: Build Kastrati TV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint and build both APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Package and verify
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/Kastrati-TV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk deliverables/Kastrati-TV.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs deliverables/Kastrati-TV.apk > deliverables/signature.txt
          "$APKSIGNER" verify --verbose deliverables/Kastrati-TV-debug.apk >> deliverables/signature.txt
          sha256sum deliverables/*.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrati-TV-APK
          path: deliverables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
