name: Build Kastrati TV
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test, lint and build both APKs
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Package and verify
        run: |
          mkdir -p deliverables
          cp app/build/outputs/apk/debug/app-debug.apk deliverables/Kastrati-TV-debug.apk
          cp app/build/outputs/apk/release/app-release.apk deliverables/Kastrati-TV.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs deliverables/Kastrati-TV.apk > deliverables/signature.txt
          "$APKSIGNER" verify --verbose deliverables/Kastrati-TV-debug.apk >> deliverables/signature.txt
          sha256sum deliverables/*.apk > deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Kastrati-TV-APK
          path: deliverables/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV installation, restart and display checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/tv-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TV-device-checks
          path: device-checks/
